<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact page for the White Water Rafting website, get in touch with us for inquiries and bookings.">
    <meta name="author" content="Spencer Bassett">
    <title>White Water Rafting | Contact Us</title>
    <link rel="stylesheet" href="styles/contact.css">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/z-wwr-oars.png" alt="White Water Rafting Logo" width="200">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="contact-info">
            <h1 class="section-heading">Wallys White Water Rafting</h1>
            <div>555 Shallow Creek Road</div>
            <div>Somewhere, USA</div>
            <div>Email: info@wallysrafting.com</div>
            <div>Phone: (123) 456-7890</div>
        </div>
        
        <div class="map-form">
            <div class="map">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d45439.575607335835!2d-111.62928552137812!3d41.05047929084181!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1790736803419!5m2!1sen!2sus" width="450" height="350" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <div class="contact-form">
                <form>
                    <div class="form-item column2">
                        <label for="fullname">Full Name:</label>
                        <input type="text" id="fullname" name="fullname" required placeholder="Your full name">
                    </div>
                    <div class="form-item column2">
                        <label for="useremail">Email:</label>
                        <input type="email" id="useremail" name="useremail" required placeholder="you@example.com">
                    </div>

                    <div class="form-item column1">
                        <span>Message Purpose</span>
                        
                        <label for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose" value="general">
                            General Inquiry
                        </label>
                        <label for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label for="purpose-suggestion">
                            <input type="radio" id="purpose-suggestion" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                
                    <div class="form-item">
                        <label for="feedback">Message</label>
                        <textarea id="feedback" name="feedback" rows="4" cols="50" required>
                        </textarea>
                    </div>

                    <div class="form-item checkbox-row">
                        <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                    </div>
                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </div>

        <div class="employees">
            <div class="section-heading">We Are Here To Serve You</div>
            <div class="employee-profiles">
                <figure>
                    <img src="images/alice.jpg" alt="Alices Picture">
                    <figcaption>Alice Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/eva.jpg" alt="Evas Picture">
                    <figcaption>Eva Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/john.jpg" alt="Johns Picture">
                    <figcaption>John Profile</figcaption>
                </figure>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Wallys White Water Rafting. Spencer Bassett.</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com" target="_blank">
                <img src="images/facebook-logo.png" alt="Facebook Icon" width="32">
            </a>
            <a href="https://www.linkedin.com" target="_blank">
                <img src="images/linkedin-logo.png" alt="LinkedIn Icon" width="40">
            </a>
            <a href="https://www.instagram.com" target="_blank">
                <img src="images/instagram-logo.jpg" alt="Instagram Icon" width="32">
            </a>
        </nav>
    </footer>
</body>
</html>
